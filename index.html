<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body style="background-color: black; display: flex; justify-content: center; min-height:100vh; align-items: center;">
    <div class="container">
        <div id="display"></div>
        <div class="buttons">
            <div class="left">
                <div class="row">
                    <button class="number">7</button>
                    <button class="number">8</button>
                    <button class="number">9</button>
                </div>
                <div class="row">
                    <button class="number">4</button>
                    <button class="number">5</button>
                    <button class="number">6</button>
                </div>
                <div class="row">
                    <button class="number">1</button>
                    <button class="number">2</button>
                    <button class="number">3</button>
                </div>
                <div class="row">
                    <div class ="dotCE">
                        <button class="yellowBox clear">CE</button>  
                        <button class="yellowBox dot">.</button>  
                    </div>
                    <button class="number">0</button>
                    <button class="yellowBox equals">=</button>
                </div>
            </div>
            <div class="operators">
                <button class="backspace">⌫</button>
                <button class="opt">+</button>
                <button class="opt">-</button>
                <button class="opt">x</button>
                <button class="opt">/</button>
            </div>
        </div>
    </div>
</body>
</html>
